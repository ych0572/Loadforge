name: Build Windows wheels

on:
  workflow_dispatch:          # 手动在 GitHub 网页上点 Run workflow
  push:
    tags:
      - "v*"                  # 打 tag 时自动构建

jobs:
  windows:
    name: Windows x64 py${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist -i python
          rust-toolchain: stable

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-py${{ matrix.python-version }}
          path: dist
          if-no-files-found: error
